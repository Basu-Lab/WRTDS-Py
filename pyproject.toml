[project]
name = "wrtds-py"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "manuel-alvarez-chaves", email = "malvarez062@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "scipy>=1.18.0",
]

[project.scripts]
wrtds-py = "wrtds_py:main"

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.0",
    "pytest>=9.1.1",
    "rpy2>=3.6.7",
]
