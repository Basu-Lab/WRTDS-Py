# Builds the package and publishes it to PyPI when a GitHub release is published.
#
# Uses PyPI Trusted Publishing (OIDC), so no API token is stored in the repository.
# One-time setup (TODO before the first release):
#   1. On PyPI, add a "pending publisher" for the project at
#      https://pypi.org/manage/account/publishing/ with:
#        PyPI project name: wrtds-py
#        Owner:             Basu-Lab
#        Repository name:   WRTDS-Py
#        Workflow name:     publish.yml
#        Environment name:  pypi
#   2. In this repository, create an environment named "pypi" under
#      Settings > Environments (optionally requiring reviewer approval).
#
# To release: bump `version` in pyproject.toml, update CHANGELOG.md, push a tag
# `vX.Y.Z` matching that version, and publish a GitHub release from the tag.
name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Check that the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv version --short)"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi

      # The EGRET comparison (tests/test_r_reference.py) needs R and is not run here;
      # the dev group is skipped because it pulls in rpy2, which also needs R.
      - name: Run tests
        run: uv run --no-dev --with pytest pytest tests/test_components.py tests/test_models.py

      - name: Build sdist and wheel
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/wrtds-py/
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
